services:
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Node / KRaft
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CLUSTER_ID: kafka-cluster-1

      # Listeners (internal + external)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single-node safety
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    container_name: patient-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db-data-patient:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-auth:
    container_name: auth-db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER_AUTH}
      POSTGRES_PASSWORD: ${DB_PASS_AUTH}
      POSTGRES_DB: ${DB_NAME_AUTH}
    ports:
      - "5433:5432"
    volumes:
      - db-data-auth:/var/lib/postgresql/data_auth
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER_AUTH} -d ${DB_NAME_AUTH}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  patient-service:
    build: ./patient-service
    container_name: patient-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - BILLING_SERVICE_ADDRESS=billing-service
      - BILLING_SERVICE_GRPC_PORT=${BILLING_SERVICE_GRPC_PORT}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST_AUTH}:${DB_PORT_AUTH}/${DB_NAME_AUTH}
      - SPRING_DATASOURCE_USERNAME=${DB_USER_AUTH}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS_AUTH}
      - JWT_SECRET=e7e1b722ce927d20971850c1acf0a0a14eb344668a6f20fb000704558844105fd34b1967
      - SERVER_PORT=4003
    ports:
      - "${AUTH_SERVICE_PORT}:4003"
    depends_on:
      postgres-auth:
        condition: service_healthy

  billing-service:
    build: ./billing-service
    container_name: billing-service
    ports:
      - ${BILLING_SERVICE_PORT}:4001
      - ${BILLING_SERVICE_GRPC_PORT}:9001
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - ${ANALYTICS_SERVICE_PORT}:4002
    depends_on:
      kafka:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4003
    ports:
      - ${API_GATEWAY_PORT}:4004
    depends_on:
      patient-service:
        condition: service_started

  adminer:
    container_name: patient-service-adminer
    image: adminer:latest
    restart: always
    ports:
      - "8088:8080"

volumes:
  db-data-patient:
  db-data-auth: