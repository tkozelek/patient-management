services:
  postgres:
    container_name: patient-service-postgres
    image: postgres:15-alpine
    ports:
      - "${DB_PORT}:5432"
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  patient-service:
    build: ./patient-service
    container_name: patient-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_USER}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    ports:
      - ${PATIENT_SERVICE_PORT}:8080
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    container_name: patient-service-adminer
    image: adminer:latest
    restart: always
    ports:
      - "8080:8080"

volumes:
  db-data: